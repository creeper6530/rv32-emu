[package]
name = "rv32-emu-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.33"
object = { version = "0.40.0", optional = true }

[features]
#default = ["alloc"]
alloc = []
std = ["alloc"]
object = ["dep:object", "std", "alloc"]

# Enable the `alloc` feature for tests
[dev-dependencies]
memmap2 = "0.9.11"
rv32-emu-lib = { path = ".", features = [
    "alloc",
    "std",
    "object"
] }
