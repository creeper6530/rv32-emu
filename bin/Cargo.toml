[package]
name = "rv32-emu-bin"
version = "0.1.0"
edition = "2024"

[dependencies]
# Frontend dependencies
anyhow = { version = "1.0.104", features = ["backtrace"] }
clap = { version = "4.6.4", features = ["derive"] }
log = "0.4.33"
env_logger = "0.11.11"

# Backend(ish) dependencies
hex = { version = "0.4.3", features = ["alloc"] }
memmap2 = "0.9.11"
object = "0.40.0"

# Local dependencies
rv32-emu-lib = { path = "../lib", features = ["alloc", "object"] }
